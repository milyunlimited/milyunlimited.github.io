<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Usług / Mily Unlimited</title>
<meta name="description" content="Status projektów Mily Unlimited">
<link rel="canonical" href="https://milyunlimited.eu/status.html" />
    <link rel="icon" type="image/x-icon" href="i/images/favicon.ico">

    <style>
        /* --- VARIABLES & DESIGN SYSTEM --- */
        :root {
            --text-main: #111111;
            --text-muted: #666666;
            --bg-light: #ffffff;
            --bg-card: #f8f9fa;
            --border: rgba(0, 0, 0, 0.06);
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            
            /* Kolory statusów */
            --color-operational: #2e7d32;   /* Zielony */
            --color-outage: #d32f2f;        /* Czerwony */
            --color-degraded: #ed6c02;      /* Pomarańczowy */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-sans); color: var(--text-main); background: var(--bg-light); line-height: 1.6; padding: 0 4%; }

        /* HEADER & CONTAINER */
        .status-container { max-width: 760px; margin: 80px auto; }
        
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 48px;
        }
        .logo { font-weight: 700; font-size: 18px; text-decoration: none; color: var(--text-main); }
        .logo span { font-weight: 400; color: var(--text-muted); }

        /* GŁÓWNY BANER STATUSU (Zmienia się dynamicznie) */
        .main-status-banner {
            padding: 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 48px;
            transition: all 0.3s ease;
        }

        /* Ikona pulsująca w banerze */
        .pulse-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }

        /* LISTA KOMPONENTÓW */
        .services-box {
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 48px;
            background: #fff;
        }

        .service-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }
        .service-row:last-child { border-bottom: none; }

        .service-info h3 { font-size: 15px; font-weight: 500; }
        .service-info p { font-size: 13px; color: var(--text-muted); }
        
        .status-label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

        /* SEKCJA ZGŁASZANIA AWARII */
        .report-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            text-align: center;
        }
        .report-section h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .report-section p { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }
        
        .social-links { display: flex; justify-content: center; gap: 16px; }
        .social-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: 1px solid var(--border);
            background: #fff;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s, border-color 0.2s;
        }
        .social-btn:hover { background: #f1f1f3; border-color: rgba(0,0,0,0.15); }

        /* STYLE DYNAMICZNE (wstrzykiwane przez JS w zależności od stanu) */
        .state-operational { background: rgba(46, 125, 50, 0.06); color: var(--color-operational); }
        .state-operational .pulse-dot { background: var(--color-operational); animation: pulse 2s infinite; }

        .state-degraded { background: rgba(237, 108, 2, 0.08); color: var(--color-degraded); }
        .state-degraded .pulse-dot { background: var(--color-degraded); animation: pulse 2s infinite; }

        .state-outage { background: rgba(211, 47, 47, 0.06); color: var(--color-outage); }
        .state-outage .pulse-dot { background: var(--color-outage); animation: pulse 2s infinite; }
    </style>
</head>
<body>

    <div class="status-container">
        
        <!-- NAGŁÓWEK -->
        <header class="status-header">
            <a href="index.html" class="logo"><img width="150px" src="i/images/milyunlogo-whiteback.png">  <span>Status</span></a>
            <div style="font-size: 13px; color: var(--text-muted);" id="current-time">Aktualizacja na żywo</div>
        </header>

        <!-- DYNAMICZNY BANER GŁÓWNY -->
        <div id="main-status" class="main-status-banner">
            <span class="pulse-dot"></span>
            <span id="main-status-text">Sprawdzanie systemów...</span>
        </div>

        <!-- LISTA USŁUG -->
        <div class="services-box" id="services-list">
            <!-- Tutaj JS automatycznie wyrenderuje usługi z konfiguracji -->
        </div>

        <!-- GDZIE ZGŁASZAĆ (SOCIAL MEDIA) -->
        <section class="report-section">
            <h3>Coś nie działa, a wykres milczy?</h3>
            <p>Nasz zespół monitoruje sieć 24/7. Jeśli jednak zauważyłeś problem z infrastrukturą, daj nam znać najszybciej poprzez nasze kanały społecznościowe:</p>
            <div class="social-links">
                <!-- Portal X (Twitter) -->
                <a href="https://x.com/milyunlimited" target="_blank" class="social-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    Daj znać na X
                </a>
                <!-- Instagram -->
                <a href="https://instagram.com/milyunlimited" target="_blank" class="social-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                    Napisz na IG
                </a>
            </div>
        </section>

    </div>

    <!-- MAIN CONFIGURATION SCRIPT -->
    <script>
        // =================================================================
        //                     MIEJSCE DO EDYCJI STATUSU
        // =================================================================
        // Dostępne statusy do wpisania:
        // 'operational' -> Wszystko działa (zielony)
        // 'degraded'    -> Działa wolniej / drobne błędy (pomarańczowy)
        // 'outage'      -> Totalna awaria (czerwony)
        // =================================================================
        
        const servicesData = [
            { 
                name: "MBSP.com.pl - Web App", 
                description: "Główna strona, katalog, wyszukiwanie, dodawanie do koszyka", 
                status: "operational" 
            },
            { 
                name: "MBSP.com.pl - Payments", 
                description: "Płatności Stripe, Paypal, etc.", 
                status: "operational" 
            },
            { 
                name: "ChatAI", 
                description: "Czatbot na stronie MBSP.com.pl/ai", 
                status: "operational" // Przykładowy totalny pad systemu
            }
        ];

        // =================================================================
        // LOGIKA GENEROWANIA (Nie musisz tu nic zmieniać)
        // =================================================================
        
        function renderStatusPage() {
            const listContainer = document.getElementById('services-list');
            const mainStatusBanner = document.getElementById('main-status');
            const mainStatusText = document.getElementById('main-status-text');
            
            let hasOutage = false;
            let hasDegraded = false;
            
            listContainer.innerHTML = ''; // Czyszczenie

            // Renderowanie wierszy na podstawie powyższej konfiguracji arraya
            servicesData.forEach(service => {
                if (service.status === 'outage') hasOutage = true;
                if (service.status === 'degraded') hasDegraded = true;

                let labelText = 'Działa poprawnie';
                let labelColor = 'var(--color-operational)';
                
                if (service.status === 'degraded') {
                    labelText = 'Zakłócenia';
                    labelColor = 'var(--color-degraded)';
                } else if (service.status === 'outage') {
                    labelText = 'Awaria';
                    labelColor = 'var(--color-outage)';
                }

                const rowHtml = `
                    <div class="service-row">
                        <div class="service-info">
                            <h3>${service.name}</h3>
                            <p>${service.description}</p>
                        </div>
                        <div class="status-label" style="color: ${labelColor}">${labelText}</div>
                    </div>
                `;
                listContainer.innerHTML += rowHtml;
            });

            // Ustawianie głównego baneru na samej górze
            if (hasOutage) {
                mainStatusBanner.className = "main-status-banner state-outage";
                mainStatusText.innerText = "Niektóre systemy zgłaszają krytyczną awarię";
            } else if (hasDegraded) {
                mainStatusBanner.className = "main-status-banner state-degraded";
                mainStatusText.innerText = "Wszystkie systemy działają, ale występują drobne zakłócenia wydajności";
            } else {
                mainStatusBanner.className = "main-status-banner state-operational";
                mainStatusText.innerText = "Wszystkie systemy działają prawidłowo";
            }

            // Ustawienie dzisiejszej daty w rogu
            const now = new Date();
            document.getElementById('current-time').innerText = `Stan na: ${now.toLocaleDateString('pl-PL')} ${now.toLocaleTimeString('pl-PL', {hour: '2-digit', minute:'2-digit'})}`;
        }

        // Odpalenie skryptu przy ładowaniu strony
        document.addEventListener("DOMContentLoaded", renderStatusPage);
    </script>
</body>
</html>
